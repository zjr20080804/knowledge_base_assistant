services:
  redis:
    image: redis:latest
    container_name: kb-redis
    ports:
      - "6379:6379"
    restart: always

  app:
    build: .
    container_name: kb-app
    depends_on:
      - redis
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LANGSMITH_PROJECT=kb-assistant
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-key-change_me}
      - DEBUG=false
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    env_file:
      - ./.env