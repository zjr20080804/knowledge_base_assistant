[project]
name = "pythonproject"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-google-vertexai>=3.2.4",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-redis>=0.5.2",
    "notebook>=7.6.2",
    "numexpr>=2.14.2",
    "python-dotenv>=1.2.3",
    "ragas==0.2.15",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "selenium>=4.49.0",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
    "webdriver-manager>=4.1.2",
    "torch>=2.0",
    "tiktoken>=0.14.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
